<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="statusbar">
    <span class="statusbar-title">PS5 Hub</span>
  </div>

  <div class="container">
    <header class="header">
      <h1>Plugins</h1>
      <p class="subtitle">Select a tile to launch</p>
    </header>

    <main class="grid" id="pluginGrid">
      <!-- Plugins loaded dynamically here -->
    </main>

    <div id="message" class="message"></div>

    <footer class="footer">
      <p>Created by <a href="https://github.com/sanchitd5" target="_blank" rel="noopener noreferrer">Sanchit Dang</a></p>
    </footer>
  </div>

  <div id="iframeModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">×</button>
      <iframe id="iframeContainer" src="" frameborder="0"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
